name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rebuild full roadbook
        run: |
          mkdir -p dist/assets
          cat .site-parts/part-01.txt \
              .site-parts/part-02.txt \
              .site-parts/part-03.txt \
              .site-parts/part-04.txt \
              .site-parts/part-05.txt > dist/index.html
          cat .site-assets/route-poster.part01 \
              .site-assets/route-poster.part02 \
              .site-assets/route-poster.part03 \
              .site-assets/route-poster.part04 \
              .site-assets/route-poster.part05 > dist/assets/qinghai-gansu-route-poster.webp
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')

          defaults = {
              'fuel': '7.3',
              'rental': '2700',
              'hotel': '1300',
              'ticket': '800',
          }
          for field_id, value in defaults.items():
              pattern = rf'(<input id="{field_id}"[^>]*\bvalue=")[^"]*(")'
              s, count = re.subn(pattern, rf'\g<1>{value}\2', s, count=1)
              if count != 1:
                  raise SystemExit(f'Failed to update budget field: {field_id}')

          poster = '''  <div class="panel" style="margin:0 0 18px;overflow:hidden;">\n    <h3 style="margin:0 0 6px;font-size:20px;">路线海报版总览</h3>\n    <p class="section-lead" style="margin-bottom:14px;">先用海报快速看全程路线与主要节点，再结合下方交互地图查看位置。手机和微信浏览时可直接上下滑动查看。</p>\n    <a href="assets/qinghai-gansu-route-poster.webp" target="_blank" rel="noreferrer" aria-label="点击查看路线海报大图">\n      <img src="assets/qinghai-gansu-route-poster.webp" alt="青甘大环线 9.25—10.2 路线海报总览" loading="eager" decoding="async" style="display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line);background:#eef2df;">\n    </a>\n  </div>\n'''
          marker = '  <div id="map"></div>\n'
          if 'assets/qinghai-gansu-route-poster.webp' not in s:
              if marker not in s:
                  raise SystemExit('Map marker not found')
              s = s.replace(marker, poster + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
          test -s dist/index.html
          test -s dist/assets/qinghai-gansu-route-poster.webp
          test "$(wc -c < dist/assets/qinghai-gansu-route-poster.webp)" -gt 30000
          grep -q 'assets/qinghai-gansu-route-poster.webp' dist/index.html
          grep -q '路线海报版总览' dist/index.html
          grep -q 'id="fuel" type="number" value="7.3"' dist/index.html
          grep -q 'id="rental" type="number" value="2700"' dist/index.html
          grep -q 'id="hotel" type="number" value="1300"' dist/index.html
          grep -q 'id="ticket" type="number" value="800"' dist/index.html
          grep -q "快速预算估算器" dist/index.html
          grep -q "8天 7夜 · 逐日执行版" dist/index.html
          grep -q "资料来源 · 可点击复核" dist/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
