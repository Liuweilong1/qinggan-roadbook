name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install image tools
        run: python -m pip install --quiet pillow

      - name: Rebuild full roadbook
        run: |
          mkdir -p dist/assets
          cat .site-parts/part-01.txt \
              .site-parts/part-02.txt \
              .site-parts/part-03.txt \
              .site-parts/part-04.txt \
              .site-parts/part-05.txt > dist/index.html
          cp assets/qinghai-gansu-route-poster-hd-v3.svg dist/assets/qinghai-gansu-route-poster-hd-v3.svg

          # These 25 chunks are the exact, previously verified 500×707 JPEG source.
          cat .site-assets/poster-v29.part{01..25} > /tmp/qinggan-poster-source.jpg

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          from PIL import Image, ImageFilter

          source_path = Path('/tmp/qinggan-poster-source.jpg')
          source_img = source_path.read_bytes()
          expected_source_size = 78059
          expected_source_sha256 = 'b77c833cdec66ba6e4578fd6a750215e9d0b381dcec5b57a2526fc2c1c1d3792'
          actual_source_sha256 = hashlib.sha256(source_img).hexdigest()
          if len(source_img) != expected_source_size:
              raise SystemExit(f'Poster source size mismatch: {len(source_img)} != {expected_source_size}')
          if actual_source_sha256 != expected_source_sha256:
              raise SystemExit(f'Poster source SHA256 mismatch: {actual_source_sha256} != {expected_source_sha256}')
          if not (source_img.startswith(b'\xff\xd8\xff') and source_img.endswith(b'\xff\xd9')):
              raise SystemExit('Poster source JPEG header/tail invalid')

          with Image.open(source_path) as im:
              if im.size != (500, 707):
                  raise SystemExit(f'Poster source dimensions mismatch: {im.size}')
              src = im.convert('RGB')

          # 3× Lanczos upscale plus restrained sharpening. No content/layout is regenerated.
          hd = src.resize((1500, 2121), Image.Resampling.LANCZOS)
          hd = hd.filter(ImageFilter.UnsharpMask(radius=1.1, percent=115, threshold=2))
          asset_rel = 'assets/qinghai-gansu-route-poster-community-v32-hd.jpg'
          img_path = Path('dist') / asset_rel
          hd.save(img_path, 'JPEG', quality=92, optimize=True, subsampling=0)

          hd_bytes = img_path.read_bytes()
          if len(hd_bytes) < 500000:
              raise SystemExit(f'HD poster unexpectedly small: {len(hd_bytes)} bytes')
          if not (hd_bytes.startswith(b'\xff\xd8\xff') and hd_bytes.endswith(b'\xff\xd9')):
              raise SystemExit('HD poster JPEG header/tail invalid')
          with Image.open(img_path) as check:
              if check.size != (1500, 2121):
                  raise SystemExit(f'HD poster dimensions mismatch: {check.size}')
              check.verify()
          print(f'Poster source verified: {len(source_img)} bytes 500x707 sha256={actual_source_sha256}')
          print(f'HD poster verified: {len(hd_bytes)} bytes 1500x2121 sha256={hashlib.sha256(hd_bytes).hexdigest()}')

          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')

          defaults = {'fuel':'7.3','rental':'2700','hotel':'1300','ticket':'800'}
          for field_id, value in defaults.items():
              pattern = rf'(<input id="{field_id}"[^>]*\bvalue=")[^"]*(")'
              s, count = re.subn(pattern, rf'\g<1>{value}\2', s, count=1)
              if count != 1:
                  raise SystemExit(f'Failed to update budget field: {field_id}')

          poster = f'''  <div class="panel" style="margin:0 0 18px;overflow:hidden;">\n    <h3 style="margin:0 0 6px;font-size:20px;">路线海报版总览</h3>\n    <p class="section-lead" style="margin-bottom:14px;">社区旅行海报风格高清完整版。点击图片可在新页面查看大图，再结合下方交互地图查看具体位置。</p>\n    <a href="{asset_rel}" target="_blank" rel="noreferrer" aria-label="点击查看路线海报高清大图" style="display:block;cursor:zoom-in;">\n      <img src="{asset_rel}" alt="青甘大环线 9.25—10.2 路线海报总览" width="1500" height="2121" loading="eager" decoding="async" style="display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line);background:#eef2df;">\n    </a>\n  </div>\n'''
          marker = '  <div id="map"></div>\n'
          if '路线海报版总览' in s:
              s, count = re.subn(
                  r'  <div class="panel" style="margin:0 0 18px;overflow:hidden;">\n    <h3 style="margin:0 0 6px;font-size:20px;">路线海报版总览</h3>.*?  </div>\n',
                  poster, s, count=1, flags=re.S,
              )
              if count != 1:
                  raise SystemExit('Failed to replace route poster panel')
          else:
              if marker not in s:
                  raise SystemExit('Map marker not found')
              s = s.replace(marker, poster + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

          python .site-scripts/relax_page.py dist/index.html dist/assets/qinghai-gansu-route-poster-hd-v3.svg
          python .site-scripts/add_services.py dist/index.html
          python .site-scripts/add_vehicle.py dist/index.html
          python .site-scripts/reorder_services.py dist/index.html
          python .site-scripts/domestic_map.py dist/index.html

          # Publish the 7 user-approved daily route maps and insert them under each matching day card.
          cp assets/day{2..8}_route_map.jpg dist/assets/
          python .site-scripts/add_daily_maps.py dist/index.html

          test -s dist/index.html
          test -s dist/assets/qinghai-gansu-route-poster-community-v32-hd.jpg
          grep -q 'assets/qinghai-gansu-route-poster-community-v32-hd.jpg' dist/index.html
          grep -q '路线海报版总览' dist/index.html
          grep -q '社区旅行海报风格高清完整版' dist/index.html
          grep -q 'id="fuel" type="number" value="7.3"' dist/index.html
          grep -q 'id="rental" type="number" value="2700"' dist/index.html
          grep -q 'id="hotel" type="number" value="1300"' dist/index.html
          grep -q 'id="ticket" type="number" value="800"' dist/index.html
          grep -q 'id="cons" type="number" value="9"' dist/index.html
          grep -q '神州租车 BJ30' dist/index.html
          grep -q '舒适补油间隔约 400–450km' dist/index.html
          grep -q '沿途加油 · 卫生间 · 休息点' dist/index.html
          grep -q '肃南县城作为主要加油节点' dist/index.html
          grep -q 'wgs84ToGcj02' dist/index.html
          grep -q '资料来源 · 可点击复核' dist/index.html
          ! grep -q '快餐化' dist/index.html
          ! grep -q '第一场硬仗' dist/index.html
          ! grep -q '极限挑战' dist/index.html
          ! grep -q '赶火车' dist/index.html

          for i in {2..8}; do
            test -s "dist/assets/day${i}_route_map.jpg"
            grep -q "data-route-map=\"day${i}\"" dist/index.html
            grep -q "assets/day${i}_route_map.jpg" dist/index.html
          done

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          s = Path('dist/index.html').read_text(encoding='utf-8')
          stay = s.find('<section id="stay">')
          services = s.find('<section id="services">')
          xhs = s.find('<section id="xhs">')
          if not (stay < services < xhs):
              raise SystemExit('services section order is incorrect')
          if s.count('data-route-map=') != 7:
              raise SystemExit(f'daily route map panel count mismatch: {s.count("data-route-map=")} != 7')
          p = Path('dist/assets/qinghai-gansu-route-poster-community-v32-hd.jpg')
          with Image.open(p) as im:
              if im.size != (1500, 2121):
                  raise SystemExit(f'final HD poster dimension check failed: {im.size}')
          for i in range(2, 9):
              p = Path(f'dist/assets/day{i}_route_map.jpg')
              with Image.open(p) as im:
                  if im.size != (1122, 1402):
                      raise SystemExit(f'day{i} route map dimension check failed: {im.size}')
          print('Verified 7 daily route maps at 1122x1402 and all panels inserted.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
