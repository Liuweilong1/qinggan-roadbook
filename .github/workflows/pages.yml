name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rebuild full roadbook
        run: |
          mkdir -p dist/assets
          cat .site-parts/part-01.txt \
              .site-parts/part-02.txt \
              .site-parts/part-03.txt \
              .site-parts/part-04.txt \
              .site-parts/part-05.txt > dist/index.html
          cp assets/qinghai-gansu-route-poster-hd-v3.svg dist/assets/qinghai-gansu-route-poster-hd-v3.svg
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('.site-assets/poster-user-v16.bin')
          data = source.read_bytes()
          if data.startswith(b'\xff\xd8\xff'):
              ext = 'jpg'
              if data[-2:] != b'\xff\xd9':
                  raise SystemExit('Poster JPEG is incomplete')
          elif data.startswith(b'\x89PNG\r\n\x1a\n'):
              ext = 'png'
              if not data.endswith(b'IEND\xaeB`\x82'):
                  raise SystemExit('Poster PNG is incomplete')
          else:
              raise SystemExit(f'Unsupported poster format; magic={data[:12].hex()} size={len(data)}')
          if len(data) < 30000:
              raise SystemExit(f'Poster file unexpectedly small: {len(data)} bytes')
          asset_rel = f'assets/qinghai-gansu-route-poster-user-v16.{ext}'
          target = Path('dist') / asset_rel
          target.write_bytes(data)
          print(f'Poster ready: {asset_rel}; {len(data)} bytes; magic={data[:8].hex()}')

          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')

          defaults = {
              'fuel': '7.3',
              'rental': '2700',
              'hotel': '1300',
              'ticket': '800',
          }
          for field_id, value in defaults.items():
              pattern = rf'(<input id="{field_id}"[^>]*\bvalue=")[^"]*(")'
              s, count = re.subn(pattern, rf'\g<1>{value}\2', s, count=1)
              if count != 1:
                  raise SystemExit(f'Failed to update budget field: {field_id}')

          poster = f'''  <div class="panel" style="margin:0 0 18px;overflow:hidden;">\n    <h3 style="margin:0 0 6px;font-size:20px;">路线海报版总览</h3>\n    <p class="section-lead" style="margin-bottom:14px;">社区旅行海报风格完整版。点击图片可在新页面查看原图，再结合下方交互地图查看具体位置。</p>\n    <a href="{asset_rel}" target="_blank" rel="noreferrer" aria-label="点击查看路线海报大图" style="display:block;cursor:zoom-in;">\n      <img src="{asset_rel}" alt="青甘大环线 9.25—10.2 路线海报总览" loading="eager" decoding="async" style="display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line);background:#eef2df;">\n    </a>\n  </div>\n'''
          marker = '  <div id="map"></div>\n'
          if '路线海报版总览' in s:
              s, count = re.subn(
                  r'  <div class="panel" style="margin:0 0 18px;overflow:hidden;">\n    <h3 style="margin:0 0 6px;font-size:20px;">路线海报版总览</h3>.*?  </div>\n',
                  poster,
                  s,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit('Failed to replace route poster panel')
          else:
              if marker not in s:
                  raise SystemExit('Map marker not found')
              s = s.replace(marker, poster + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
          python .site-scripts/relax_page.py dist/index.html dist/assets/qinghai-gansu-route-poster-hd-v3.svg
          python .site-scripts/add_services.py dist/index.html
          python .site-scripts/add_vehicle.py dist/index.html
          python .site-scripts/reorder_services.py dist/index.html
          python .site-scripts/domestic_map.py dist/index.html
          test -s dist/index.html
          python - <<'PY'
          from pathlib import Path
          s = Path('dist/index.html').read_text(encoding='utf-8')
          required = [
              'assets/qinghai-gansu-route-poster-user-v16.',
              '路线海报版总览',
              '神州租车 BJ30',
              '沿途加油 · 卫生间 · 休息点',
              '资料来源 · 可点击复核',
              'wgs84ToGcj02',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing required content: ' + ', '.join(missing))
          stay = s.find('<section id="stay">')
          services = s.find('<section id="services">')
          xhs = s.find('<section id="xhs">')
          if not (stay < services < xhs):
              raise SystemExit('services section order is incorrect')
          poster_files = list(Path('dist/assets').glob('qinghai-gansu-route-poster-user-v16.*'))
          if len(poster_files) != 1 or poster_files[0].stat().st_size < 30000:
              raise SystemExit('Published poster asset missing or too small')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
