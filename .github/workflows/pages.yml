name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rebuild full roadbook
        run: |
          mkdir -p dist/assets
          cat .site-parts/part-01.txt \
              .site-parts/part-02.txt \
              .site-parts/part-03.txt \
              .site-parts/part-04.txt \
              .site-parts/part-05.txt > dist/index.html
          cp assets/qinghai-gansu-route-poster-hd-v3.svg dist/assets/qinghai-gansu-route-poster-hd-v3.svg
          cat .site-assets/poster-v29.part01 \
              .site-assets/poster-v29.part02 \
              .site-assets/poster-v29.part03 \
              .site-assets/poster-v29.part04 \
              .site-assets/poster-v29.part05 \
              .site-assets/poster-v29.part06 \
              .site-assets/poster-v29.part07 \
              .site-assets/poster-v29.part08 \
              .site-assets/poster-v29.part09 \
              .site-assets/poster-v29.part10 \
              .site-assets/poster-v29.part11 \
              .site-assets/poster-v29.part12 \
              .site-assets/poster-v29.part13 \
              .site-assets/poster-v29.part14 \
              .site-assets/poster-v29.part15 \
              .site-assets/poster-v29.part16 \
              .site-assets/poster-v29.part17 \
              .site-assets/poster-v29.part18 \
              .site-assets/poster-v29.part19 \
              .site-assets/poster-v29.part20 \
              .site-assets/poster-v29.part21 \
              .site-assets/poster-v29.part22 \
              .site-assets/poster-v29.part23 \
              .site-assets/poster-v29.part24 \
              .site-assets/poster-v29.part25 \
              > dist/assets/qinghai-gansu-route-poster-community-v29.jpg
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          asset_rel = 'assets/qinghai-gansu-route-poster-community-v29.jpg'
          img_path = Path('dist') / asset_rel
          img = img_path.read_bytes()
          expected_size = 78059
          expected_sha256 = 'b77c833cdec66ba6e4578fd6a750215e9d0b381dcec5b57a2526fc2c1c1d3792'
          actual_sha256 = hashlib.sha256(img).hexdigest()
          if len(img) != expected_size:
              raise SystemExit(f'Poster size mismatch: {len(img)} != {expected_size}')
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'Poster SHA256 mismatch: {actual_sha256} != {expected_sha256}')
          if not (img.startswith(b'\xff\xd8\xff') and img.endswith(b'\xff\xd9')):
              raise SystemExit('Poster JPEG header/tail invalid')

          i = 2
          width = height = None
          while i + 9 < len(img):
              if img[i] != 0xFF:
                  i += 1
                  continue
              while i < len(img) and img[i] == 0xFF:
                  i += 1
              if i >= len(img):
                  break
              marker_code = img[i]
              i += 1
              if marker_code in (0xD8, 0xD9) or 0xD0 <= marker_code <= 0xD7:
                  continue
              if i + 2 > len(img):
                  break
              seglen = int.from_bytes(img[i:i+2], 'big')
              if marker_code in (0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF):
                  if i + 7 <= len(img):
                      height = int.from_bytes(img[i+3:i+5], 'big')
                      width = int.from_bytes(img[i+5:i+7], 'big')
                  break
              if seglen < 2:
                  break
              i += seglen
          if (width, height) != (500, 707):
              raise SystemExit(f'Poster dimensions mismatch: {width}x{height}')
          print(f'Poster verified byte-for-byte: {len(img)} bytes {width}x{height} sha256={actual_sha256}')

          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')

          defaults = {
              'fuel': '7.3',
              'rental': '2700',
              'hotel': '1300',
              'ticket': '800',
          }
          for field_id, value in defaults.items():
              pattern = rf'(<input id="{field_id}"[^>]*\bvalue=")[^"]*(")'
              s, count = re.subn(pattern, rf'\g<1>{value}\2', s, count=1)
              if count != 1:
                  raise SystemExit(f'Failed to update budget field: {field_id}')

          poster = f'''  <div class="panel" style="margin:0 0 18px;overflow:hidden;">\n    <h3 style="margin:0 0 6px;font-size:20px;">路线海报版总览</h3>\n    <p class="section-lead" style="margin-bottom:14px;">社区旅行海报风格完整版。点击图片可在新页面查看大图，再结合下方交互地图查看具体位置。</p>\n    <a href="{asset_rel}" target="_blank" rel="noreferrer" aria-label="点击查看路线海报大图" style="display:block;cursor:zoom-in;">\n      <img src="{asset_rel}" alt="青甘大环线 9.25—10.2 路线海报总览" loading="eager" decoding="async" style="display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line);background:#eef2df;">\n    </a>\n  </div>\n'''
          marker = '  <div id="map"></div>\n'
          if '路线海报版总览' in s:
              s, count = re.subn(
                  r'  <div class="panel" style="margin:0 0 18px;overflow:hidden;">\n    <h3 style="margin:0 0 6px;font-size:20px;">路线海报版总览</h3>.*?  </div>\n',
                  poster,
                  s,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit('Failed to replace route poster panel')
          else:
              if marker not in s:
                  raise SystemExit('Map marker not found')
              s = s.replace(marker, poster + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
          python .site-scripts/relax_page.py dist/index.html dist/assets/qinghai-gansu-route-poster-hd-v3.svg
          python .site-scripts/add_services.py dist/index.html
          python .site-scripts/add_vehicle.py dist/index.html
          python .site-scripts/reorder_services.py dist/index.html
          python .site-scripts/domestic_map.py dist/index.html
          test -s dist/index.html
          test -s dist/assets/qinghai-gansu-route-poster-community-v29.jpg
          grep -q 'assets/qinghai-gansu-route-poster-community-v29.jpg' dist/index.html
          grep -q '路线海报版总览' dist/index.html
          grep -q 'id="fuel" type="number" value="7.3"' dist/index.html
          grep -q 'id="rental" type="number" value="2700"' dist/index.html
          grep -q 'id="hotel" type="number" value="1300"' dist/index.html
          grep -q 'id="ticket" type="number" value="800"' dist/index.html
          grep -q 'id="cons" type="number" value="9"' dist/index.html
          grep -q '神州租车 BJ30' dist/index.html
          grep -q '舒适补油间隔约 400–450km' dist/index.html
          grep -q '沿途加油 · 卫生间 · 休息点' dist/index.html
          grep -q '肃南县城作为主要加油节点' dist/index.html
          grep -q 'wgs84ToGcj02' dist/index.html
          grep -q '资料来源 · 可点击复核' dist/index.html
          ! grep -q '快餐化' dist/index.html
          ! grep -q '第一场硬仗' dist/index.html
          ! grep -q '极限挑战' dist/index.html
          ! grep -q '赶火车' dist/index.html
          python - <<'PY'
          from pathlib import Path
          import hashlib
          s = Path('dist/index.html').read_text(encoding='utf-8')
          stay = s.find('<section id="stay">')
          services = s.find('<section id="services">')
          xhs = s.find('<section id="xhs">')
          if not (stay < services < xhs):
              raise SystemExit('services section order is incorrect')
          p = Path('dist/assets/qinghai-gansu-route-poster-community-v29.jpg')
          if hashlib.sha256(p.read_bytes()).hexdigest() != 'b77c833cdec66ba6e4578fd6a750215e9d0b381dcec5b57a2526fc2c1c1d3792':
              raise SystemExit('final poster hash check failed')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
