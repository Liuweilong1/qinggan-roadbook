    .label{font-size:20px;font-weight:800}
    .tiny{font-size:14px;fill:#66776d}
    .day{font-size:17px;font-weight:800}
    .route{fill:none;stroke:#2f6d55;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
    .route2{fill:none;stroke:#f5b74b;stroke-width:4;stroke-dasharray:10 10;stroke-linecap:round}
    .card{fill:#fffdf5;stroke:#d8dfcb;stroke-width:2}
    .num{fill:#fff;font-size:17px;font-weight:900;text-anchor:middle;dominant-baseline:middle}
  ]]></style>
</defs>
