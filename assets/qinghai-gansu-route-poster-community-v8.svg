  <linearGradient id="lake" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8fd5dd"/><stop offset="1" stop-color="#4fa7b9"/></linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4d59d"/><stop offset="1" stop-color="#d9a45f"/></linearGradient>
